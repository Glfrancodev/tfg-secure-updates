name: build-game
description: Empaqueta game/ en dist/game-X.Y.Z.zip determinista con build/package.py

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12.10'

    - name: Empaquetar el juego
      shell: bash
      run: python build/package.py
